# Block0 agent (tools/agent-tick.mjs --watch) — DRY RUN unless the repo variable AGENT_DRY_RUN is set to "0".
# One job loops every 15 min for ~5h40m (the in-memory transfer store stays warm, so only the first cycle pays full
# cold reads on the free node), then starts its own successor — GitHub's scheduler is too unreliable on this repo to
# be the clock. The cron below is only a restart if the chain ever breaks. Free while the repo is public.
# State, ledgers, the board snapshot and per-token dossiers go to the `agent-data` branch after every cycle — never
# main, so nothing here deploys anything.
# Secrets/vars (Settings → Secrets and variables → Actions): ORBIO_API_KEY (secret — posting, mentions and the free
# X-account check), vars AGENT_X_HANDLE (optional), AGENT_DRY_RUN, AGENT_MAX_ORIGINALS_PER_DAY,
# AGENT_MAX_CREDIT_PER_DAY. To stop: RUNNER_CHAIN = "0" (the current job finishes, no successor) or disable it here.
# Never add RPC_URL / ALCHEMY_* here: token reads stay on the free native node.
name: agent

on:
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out the agent-data branch (created on the first run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
          mkdir agent-data && cd agent-data
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin agent-data; then git checkout -q -b agent-data FETCH_HEAD; else git checkout -q --orphan agent-data; fi

      - name: Radar forward-test status (for the "n=" footer)
        run: git fetch -q --depth 1 origin radar-data && git show FETCH_HEAD:REPORT.txt > radar-report.txt || true

      # The transfer store from the previous job (tools/agent-tick.mjs AGENT_STORE_FILE): without it every job spent its
      # first ~3.5 h re-reading launches cold on the free node. Newest snapshot wins; GitHub evicts old ones (7 days unused
      # / 10 GB per repo). A missing or unreadable snapshot only means a cold start.
      - name: Restore the transfer store
        uses: actions/cache/restore@v4
        with:
          path: agent-store.json.gz
          key: agent-store-${{ github.run_id }}
          restore-keys: agent-store-

      - name: Watch
        env:
          AGENT_STORE_FILE: agent-store.json.gz
          AGENT_DIR: agent-data
          AGENT_GIT_COMMIT: "1"
          AGENT_WATCH_MIN: "340"
          AGENT_FORWARD_REPORT: radar-report.txt
          AGENT_DRY_RUN: ${{ vars.AGENT_DRY_RUN || '1' }}
          AGENT_X_HANDLE: ${{ vars.AGENT_X_HANDLE }}
          AGENT_MAX_ORIGINALS_PER_DAY: ${{ vars.AGENT_MAX_ORIGINALS_PER_DAY || '5' }}
          AGENT_MAX_CREDIT_PER_DAY: ${{ vars.AGENT_MAX_CREDIT_PER_DAY || '1.5' }}
          ORBIO_API_KEY: ${{ secrets.ORBIO_API_KEY }}
        run: node tools/agent-tick.mjs --watch

      - name: Save the transfer store
        if: (success() || failure()) && hashFiles('agent-store.json.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: agent-store.json.gz
          key: agent-store-${{ github.run_id }}

      # Start the next job. Skipped when this one was cancelled, when it died within 30 min (a crash loop waits for
      # the cron instead), or when RUNNER_CHAIN is "0". (An unset variable is null, which GitHub coerces to 0 against
      # '0' — hence the '1' default; without it the successor was silently skipped.)
      - name: Start the successor
        if: (success() || failure()) && (vars.RUNNER_CHAIN || '1') != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ $(( $(date +%s) - STARTED )) -lt 1800 ]; then echo "ran under 30 min — not chaining"; exit 0; fi
          gh workflow run agent.yml --ref "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}"
