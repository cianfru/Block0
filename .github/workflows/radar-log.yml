# Forward test of the smart-money radar (tools/radar-log.mjs) — runs on GitHub's machines, not the owner's laptop.
# Free: the repo is public, so Actions minutes cost nothing; the job only talks to the free native node, DexScreener,
# Pons and GeckoTerminal. One job polls every 60 s for ~5h40m, commits the log + REPORT.txt every 15 min, then starts
# its own successor (GitHub ran the old 30-min schedule only every ~4–6 h). The cron below is only a restart if the
# chain ever breaks. The log lives on the `radar-data` branch — never on main, so these commits never deploy anything.
# To stop it: set the repo variable RUNNER_CHAIN to "0" (the current job finishes, no successor), or disable the
# workflow in the Actions tab.
name: radar-log

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: radar-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out the log branch (created on the first run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
          mkdir radar-data && cd radar-data
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin radar-data; then git checkout -q -b radar-data FETCH_HEAD; else git checkout -q --orphan radar-data; fi

      - name: Score matured events
        env:
          RADAR_DIR: radar-data
        run: node tools/radar-log.mjs --outcomes || true

      - name: Watch (commits every 15 min)
        env:
          RADAR_DIR: radar-data
          RADAR_GIT_COMMIT: "1"
        run: node tools/radar-log.mjs --minutes=340

      # Start the next job. Skipped when this one was cancelled, when it died within 30 min (a crash loop waits for
      # the cron instead), or when RUNNER_CHAIN is "0". (An unset variable is null, which GitHub coerces to 0 against
      # '0' — hence the '1' default; without it the successor was silently skipped.)
      - name: Start the successor
        if: (success() || failure()) && (vars.RUNNER_CHAIN || '1') != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ $(( $(date +%s) - STARTED )) -lt 1800 ]; then echo "ran under 30 min — not chaining"; exit 0; fi
          gh workflow run radar-log.yml --ref "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}"
