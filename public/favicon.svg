<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Block0">
  <rect width="64" height="64" rx="14" fill="#08080b"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  <!-- b — slanted serif, white (unchanged) -->
  <text x="7" y="47" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-style="italic" font-weight="400" font-size="46" fill="#ffffff">b</text>
  <!-- 0 — VGA / pixel-font zero, green. Solid pixels forming a bitmap glyph with stair-stepped rounded corners
       (8×11 cell, 3px pixels), upright to match the SPX6900/Rainbow VGA logo. -->
  <g fill="#c8ff4d" shape-rendering="crispEdges">
    <rect x="39" y="15" width="12" height="3"/>              <!-- top cap -->
    <rect x="36" y="18" width="6" height="3"/><rect x="48" y="18" width="6" height="3"/>  <!-- upper corners -->
    <rect x="33" y="21" width="6" height="21"/>              <!-- left wall -->
    <rect x="51" y="21" width="6" height="21"/>              <!-- right wall -->
    <rect x="36" y="42" width="6" height="3"/><rect x="48" y="42" width="6" height="3"/>  <!-- lower corners -->
    <rect x="39" y="45" width="12" height="3"/>              <!-- bottom cap -->
  </g>
</svg>
